packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 n'exécute plus les scripts d'installation sans autorisation explicite.
# Ces paquets en ont réellement besoin : moteurs Prisma, binaire natif argon2,
# binaire esbuild.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - sharp
  - prisma
