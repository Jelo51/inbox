# Environnement de développement complet.
#
#   cp .env.example .env
#   docker compose up
#
# Au premier démarrage, le service `migrate` applique les migrations et charge
# les données de démonstration ; aucune étape manuelle n'est nécessaire.

name: inbox

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inbox}
      POSTGRES_DB: ${POSTGRES_DB:-inbox}
      # Collation déterministe : le tri des annonces doit être le même partout.
      POSTGRES_INITDB_ARGS: '--locale=C.UTF-8 --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-inbox} -d ${POSTGRES_DB:-inbox}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Mesure d'audience auto-hébergée, sans cookie : aucune donnée ne sort du
  # serveur et aucun bandeau de consentement n'est nécessaire.
  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
      POSTGRES_DB: umami
    volumes:
      - umami-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 5s
      timeout: 5s
      retries: 20

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-secret-de-developpement-a-changer}
    ports:
      - '3002:3000'
    depends_on:
      umami-db:
        condition: service_healthy

  # Applique les migrations puis charge le jeu de démonstration, une fois.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-inbox}:${POSTGRES_PASSWORD:-inbox}@postgres:5432/${POSTGRES_DB:-inbox}?schema=public
    env_file: [.env]
    volumes:
      - .:/app
      - pnpm-store:/pnpm
      - node-modules:/app/node_modules
    command: >
      bash -lc "pnpm install --frozen-lockfile &&
                pnpm --filter @inbox/shared build &&
                pnpm --filter @inbox/api exec prisma migrate deploy &&
                pnpm --filter @inbox/api exec prisma generate &&
                pnpm db:legal &&
                pnpm db:seed"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app/apps/api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-inbox}:${POSTGRES_PASSWORD:-inbox}@postgres:5432/${POSTGRES_DB:-inbox}?schema=public
    env_file: [.env]
    ports:
      - '3001:3001'
    volumes:
      - .:/app
      - pnpm-store:/pnpm
      - node-modules:/app/node_modules
    command: bash -lc "pnpm dev"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app/apps/web
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_API_BASE: http://localhost:3001/api/v1
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
    env_file: [.env]
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - pnpm-store:/pnpm
      - node-modules:/app/node_modules
    command: bash -lc "pnpm dev --host 0.0.0.0"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  umami-data:
  pnpm-store:
  node-modules:
